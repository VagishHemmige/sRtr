# Sets a commit status, "ChatGPT review", on the head commit of every pull
# request: pending until the automated ChatGPT review of that exact commit
# has been posted, then success. Make the status required for master in a
# branch ruleset, and GitHub will not merge a pull request whose latest push
# has not been reviewed.
#
# A comment counts as the review of the head commit only if it starts with
# the review's heading, "**Automated ChatGPT review**", and ends with its
# marker, <!-- srtr-automated-review:<head sha>:<base sha> -->, naming the
# current head. A review of an earlier commit, or a comment that quotes a
# review, does not count: every push needs its own review.
#
# The marker's second sha (the revision the review was read against) is not
# required to be master's current head, so merging another PR does not force
# a new review. The gate cannot prove who wrote a comment: the review
# automation and Claude post as the same account.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to recheck"
        required: true

name: chatgpt-review-gate.yaml

permissions:
  statuses: write
  pull-requests: read
  issues: read

concurrency:
  group: chatgpt-review-gate-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr }}
  # Queue rather than cancel, so no run shows as cancelled; each run reads
  # the current state, so the last one to finish is right.
  cancel-in-progress: false

jobs:
  gate:
    # Comments on issues, as opposed to pull requests, are ignored.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const number = Number(
              context.payload.pull_request?.number ??
              context.payload.issue?.number ??
              context.payload.inputs?.pr
            );
            const { owner, repo } = context.repo;

            // Always read the current head: a comment event carries no sha,
            // and a later push may have moved the head since this run began.
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: number
            });
            const sha = pr.head.sha;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: number, per_page: 100 }
            );
            const isReview = body =>
              body.trimStart().startsWith("**Automated ChatGPT review**") &&
              new RegExp(
                `<!-- srtr-automated-review:${sha}:[0-9a-f]{40} -->\\s*$`
              ).test(body);
            const reviewed = comments.some(c => isReview(c.body || ""));

            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              context: "ChatGPT review",
              state: reviewed ? "success" : "pending",
              description: reviewed
                ? `Reviewed ${sha.slice(0, 7)}`
                : `Waiting for the review of ${sha.slice(0, 7)}`
            });
            core.info(`PR #${number} at ${sha}: ${reviewed ? "reviewed" : "waiting"}`);
