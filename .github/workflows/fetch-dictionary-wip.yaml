# Temporary, for issue #26 design work only. Not for merging.
# Fetches the live SRTR SAF data dictionary page so its structure can be
# compared with the bundled 2203 snapshot. The page is public metadata
# (variable and format definitions), not patient data.
on:
  push:
    branches: [claude/wip-dictionary-fetch]

name: fetch-dictionary-wip.yaml

permissions: read-all

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live dictionary
        run: |
          mkdir -p out
          curl -sS -L --fail -A "sRtr-dictionary-check (github.com/VagishHemmige/sRtr)" \
            -D out/headers.txt -o out/datadictionary.html \
            https://www.srtr.org/docs/datadictionary.html
          curl -sS -L -A "sRtr-dictionary-check (github.com/VagishHemmige/sRtr)" \
            -o out/robots.txt -w "%{http_code}\n" https://www.srtr.org/robots.txt > out/robots_status.txt || true
          ls -l out
          sha256sum out/datadictionary.html
          grep -o '<title>[^<]*' out/datadictionary.html
          cat out/headers.txt
          echo "robots.txt status: $(cat out/robots_status.txt)"
      - name: List Wayback Machine captures (distinct contents only)
        run: |
          for u in srtr.org/docs/datadictionary.html www.srtr.org/docs/datadictionary.html; do
            echo "--- exact $u"
            curl -sS -g -L "https://web.archive.org/cdx/search/cdx?url=$u&fl=timestamp,statuscode,digest,length&collapse=digest" || true
          done
          echo "--- prefix srtr.org/docs/, dictionary in the name"
          curl -sS -g -L "https://web.archive.org/cdx/search/cdx?url=srtr.org/docs/&matchType=prefix&fl=original,timestamp,statuscode&collapse=urlkey&filter=original:.*ictionary.*&limit=200" || true
          echo "--- prefix srtr.org/, dictionary in the name"
          curl -sS -g -L "https://web.archive.org/cdx/search/cdx?url=srtr.org/&matchType=domain&fl=original,timestamp,statuscode&collapse=urlkey&filter=original:.*ictionary.*&limit=200" || true
          echo "--- end wayback"
      - name: Print the page as gzip + base64 (artifact downloads are blocked in the workspace)
        run: |
          echo "BEGIN-B64"
          gzip -9 -c out/datadictionary.html | base64 -w 76
          echo "END-B64"
      - uses: actions/upload-artifact@v4
        with:
          name: srtr-dictionary
          path: out/
          retention-days: 7
