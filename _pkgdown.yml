pkgdown:
  title: "sRtr: Work with Scientific Registry of Transplant Recipients Data"
  logo: man/figures/logo.png
  favicon: man/figures/logo.png

url: https://vagishhemmige.github.io/sRtr/

template:
  bootstrap: 5
  includes:
    in_header: |
      <meta name="google-site-verification" content="TBumihuxSFxK8muRvdo69ca7bmvzWmy-3OMfCZ2692A" />

# One short dropdown per article group (#253). Each menu ends with a link to
# the article index, where every group's description lives (pkgdown gives the
# index sections no anchors, so the link cannot jump to one group).
# tools/check-site-navbar.R fails the site build if an article listed under
# `articles:` is in no menu, or a menu link points at a missing page.
navbar:
  structure:
    left: [start, cohort, outcomes, geography, reference, contribute, news]
    right: [search, github]
  components:
    start:
      text: Start here
      menu:
        - text: Getting started
          href: articles/getting-started.html
        - text: Checking sRtr on your own SAFs
          href: articles/checking-your-safs.html
        - text: Releases, the data dictionary and warnings
          href: articles/releases-and-warnings.html
        - text: "---"
        - text: All guides, with descriptions
          href: articles/index.html
    cohort:
      text: Prepare a cohort
      menu:
        - text: Files, keys and joins
          href: articles/files-and-keys.html
        - text: Missing data
          href: articles/missing-data.html
        - text: Building cohorts
          href: articles/building-cohort-with-flowchart.html
        - text: Adding risk scores
          href: articles/adding-columns.html
        - text: "---"
        - text: All guides, with descriptions
          href: articles/index.html
    outcomes:
      text: Define outcomes
      menu:
        - text: Follow-up forms
          href: articles/follow-up-forms.html
        - text: Follow-up windows and death
          href: articles/follow-up-windows.html
        - text: "---"
        - text: All guides, with descriptions
          href: articles/index.html
    geography:
      text: Geography
      menu:
        - text: Mapping
          href: articles/mapping.html
        - text: Coverage gain
          href: articles/geographic-coverage-gain.html
        - text: "---"
        - text: All guides, with descriptions
          href: articles/index.html
    contribute:
      text: Contribute
      href: articles/development.html

reference:
  - title: File Loading
    contents:
      - load_srtr_file
      - set_srtr_wd

  - title: Variable and Factor Labeling
    contents:
      - apply_srtr_varlabels
      - apply_srtr_factors

  - title: Risk and Score Calculators
    contents:
      - add_kdpi
      - add_epts
      - add_donor_egfr
      - add_lkdpi
      - add_pdri
      - add_pvr

  - title: Missing data
    contents:
      - srtr_missing_report
      - srtr_normalize_missing

  - title: Time-to-event & composite dates
    desc: Helpers for composing event dates and simple time-to-event calculations
    contents:
      - srtr_composite_death
      - add_txf_outcomes
      - add_time_to_event_outcomes
      - srtr_time_to_event

  - title: Mapping transplant geography
    contents:
      - get_hrsa_transplant_centers
      - get_hrsa_optn_regions
      - get_hrsa_opo_service_areas
      - shift_noncontiguous
      - calculate_geography_coverage_gain
      - rank_individual_coverage_gains

  - title: Spatial datasets
    contents:
      - transplant_centers_sf
      - UNOS_regions_sf

  - title: Package data
    contents:
      - formats
      - dictionary
      - dictionary_versions
      - srtr_dictionary
      - missing_codes
      - optn_mapping_tables

articles:
  - title: Start here
    navbar: Start here
    desc: >
      Install sRtr, point it at your SAF folder and load a first file. Then
      check that sRtr reads your own release correctly.
    contents:
      - getting-started
      - articles/checking-your-safs
      - articles/releases-and-warnings

  - title: Prepare an analysis cohort
    navbar: Prepare an analysis cohort
    desc: >
      Link files on the right keys, decide what missing and unknown codes
      mean, select a cohort with a record of each exclusion, and add risk
      scores.
    contents:
      - articles/files-and-keys
      - missing-data
      - building-cohort-with-flowchart
      - adding-columns

  - title: Define outcomes
    navbar: Define outcomes
    desc: >
      Pitfalls in post-transplant outcomes: what the follow-up forms record,
      and which reports fall inside the analysis window. Each shows a naive
      approach that trips on it and the sRtr function that handles it. The
      code needs your own SAFs and is not run on this site.
    contents:
      - articles/follow-up-forms
      - articles/follow-up-windows

  - title: Geography
    navbar: Geography
    desc: >
      Map transplant centers, OPTN regions and OPO service areas, then
      estimate how much new centers would add to geographic coverage.
    contents:
      - mapping
      - articles/geographic-coverage-gain

  - title: Contribute
    navbar: Contribute
    desc: >
      Tasks you can start today, every open project, and how to take part
      without sharing SRTR data.
    contents:
      - articles/development
